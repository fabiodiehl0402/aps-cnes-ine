name: Atualizar CNES por INE
on:
  schedule:
    - cron: '17 6 5 * *'   # todo dia 5, 03h17 (Brasília)
  workflow_dispatch:
    inputs:
      ufs:
        description: 'Só estas partes (ex.: "AC BA-2 MA-1"). Vazio = todas'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        job: ["AC 1 1", "AL 1 1", "AP 1 1", "AM 1 1", "BA 1 3", "BA 2 3", "BA 3 3", "CE 1 2", "CE 2 2", "DF 1 1", "ES 1 1", "GO 1 2", "GO 2 2", "MA 1 2", "MA 2 2", "MT 1 1", "MS 1 1", "MG 1 6", "MG 2 6", "MG 3 6", "MG 4 6", "MG 5 6", "MG 6 6", "PA 1 2", "PA 2 2", "PB 1 2", "PB 2 2", "PR 1 3", "PR 2 3", "PR 3 3", "PE 1 2", "PE 2 2", "PI 1 2", "PI 2 2", "RJ 1 3", "RJ 2 3", "RJ 3 3", "RN 1 2", "RN 2 2", "RS 1 3", "RS 2 3", "RS 3 3", "RO 1 1", "RR 1 1", "SC 1 2", "SC 2 2", "SP 1 6", "SP 2 6", "SP 3 6", "SP 4 6", "SP 5 6", "SP 6 6", "SE 1 1", "TO 1 1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Extrair ${{ matrix.job }}
        shell: bash
        env:
          THREADS: '12'
          BUDGET_MIN: '280'
          JOB: ${{ matrix.job }}
          FILTRO: ${{ inputs.ufs }}
        run: |
          read UF PARTE TOTAL <<< "$JOB"
          if [ -n "$FILTRO" ] && ! echo " $FILTRO " | grep -qE " ($UF|$UF-$PARTE) "; then echo "fora do filtro: $UF-$PARTE"; exit 0; fi
          python -u scripts/extrair.py "$UF" novo "$PARTE" "$TOTAL"
      - uses: actions/upload-artifact@v4
        with:
          name: uf-${{ strategy.job-index }}
          path: novo/
          retention-days: 5
          if-no-files-found: ignore
  publicar:
    needs: extrair
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: novo, pattern: uf-*, merge-multiple: true }
      - name: Gira atual -> anterior e grava a nova foto
        env:
          FILTRO: ${{ inputs.ufs }}
        run: |
          set -e
          n=$(ls novo/*_equipes.csv.gz 2>/dev/null | wc -l)
          echo "partes extraídas: $n"
          if [ "$n" -eq 0 ]; then echo "nada extraído - mantendo a foto anterior"; exit 1; fi
          MES=$(date +%Y-%m)
          mkdir -p dados/atual
          # rodada completa: a foto atual vira a anterior; rodada parcial (filtro): só completa a atual
          if [ -z "$FILTRO" ]; then rm -rf dados/anterior; cp -r dados/atual dados/anterior; fi
          cp novo/*.csv.gz dados/atual/
          mkdir -p "dados/historico/$MES" && cp novo/*.csv.gz "dados/historico/$MES/"
          for d in atual anterior; do (cd dados/$d && ls *.csv.gz 2>/dev/null || true) > dados/$d/_arquivos.txt; done
          date -u +%Y-%m-%dT%H:%MZ > dados/ultima_atualizacao.txt
      - name: Commit
        run: |
          git config user.name "aps-cnes-bot"
          git config user.email "aps-cnes-bot@users.noreply.github.com"
          git add dados
          git commit -m "CNES por INE $(date +%Y-%m-%d)" || echo "sem mudanças"
          git push
