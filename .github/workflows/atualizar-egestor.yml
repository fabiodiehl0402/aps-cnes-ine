name: Atualizar e-Gestor (Financiamento APS)
on:
  schedule:
    - cron: '41 9 * * 1'   # toda segunda, 06h41 (Brasília)
  workflow_dispatch:
    inputs:
      parcelas:
        description: 'Quantas parcelas (meses) manter'
        required: false
        default: '12'
permissions:
  contents: write
concurrency:
  group: commit-dados
  cancel-in-progress: false
jobs:
  pagamento:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Gerar planilhas do Financiamento APS
        working-directory: scripts/egestor
        run: |
          npm install --no-save --silent xlsx@0.18.5
          node gerar_pagamento.js ../../dados/egestor/pagamento "${{ inputs.parcelas || '12' }}"
      - name: Commit
        run: |
          git config user.name "aps-cnes-bot"
          git config user.email "aps-cnes-bot@users.noreply.github.com"
          git add dados/egestor
          git commit -m "e-Gestor pagamento $(date +%Y-%m-%d)" || { echo "sem mudanças"; exit 0; }
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
